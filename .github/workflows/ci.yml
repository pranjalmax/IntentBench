name: Public source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.20.0
      - run: npm ci --ignore-scripts --strict-peer-deps --no-audit --no-fund
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run product:build
      - run: npm run replay:build
      - run: npm run audit:replay
      - run: npm run test:replay-browser
      - run: npm run audit:public
      - run: npm audit
      - run: npm audit --omit=dev
      - run: npm ls --all
